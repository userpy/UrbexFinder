
services:
  bot:
    build:
      context: ./bot
    container_name: aiogram_bot
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./bot:/app
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_started
      loki:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      rabbitmq-topology:
        condition: service_completed_successfully

  places-worker:
    build:
      context: ./bot
    restart: unless-stopped
    command: ["python", "-m", "application.workers.places_bootstrap_worker"]
    env_file:
      - ./.env
    volumes:
      - ./bot:/app
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_started
      loki:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      rabbitmq-topology:
        condition: service_completed_successfully

  migrations:
    build:
      context: ./bot
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ./.env
    volumes:
      - ./bot:/app
    depends_on:
      db:
        condition: service_healthy

  rabbitmq-topology:
    build:
      context: ./bot
    restart: "no"
    command:
      - "python"
      - "-m"
      - "infrastructure.messaging.rabbitmq.exchange_queue_topology"
    env_file:
      - ./.env
    volumes:
      - ./bot:/app
    depends_on:
      rabbitmq:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.11
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - "CMD"
        - "rabbitmq-diagnostics"
        - "-q"
        - "check_port_connectivity"
      interval: 5s
      timeout: 5s
      retries: 12

  loki:
    image: grafana/loki:2.8.2
    container_name: loki
    user: "0:0"
    ports:
      - "3110:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    volumes:
      - ./loki_data:/loki

  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  es_data:
  loki_data:
  grafana_data:
  rabbitmq_data:
