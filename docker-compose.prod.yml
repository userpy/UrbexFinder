name: urbexfinder-prod
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.11
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
    - urbex_search:/usr/share/elasticsearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null
      interval: 5s
      timeout: 8s
      retries: 30
    restart: unless-stopped
  minio:
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${URBEX_S3_ACCESS_KEY:-local-minio}
      MINIO_ROOT_PASSWORD: ${URBEX_S3_SECRET_KEY:-local-minio-change-me}
    volumes:
    - urbex_photos:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  storage-init:
    build: &id001
      context: .
      dockerfile: api/Dockerfile
    environment:
      URBEX_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      URBEX_ORIGIN: ${URBEX_PROD_ORIGIN:-https://localhost}
      URBEX_SECURE_COOKIE: 'true'
      URBEX_ENVIRONMENT: production
      URBEX_S3_ENDPOINT: http://minio:9000
      URBEX_S3_ACCESS_KEY: ${URBEX_S3_ACCESS_KEY:-local-minio}
      URBEX_S3_SECRET_KEY: ${URBEX_S3_SECRET_KEY:-local-minio-change-me}
      URBEX_S3_BUCKET: urbex-private
      URBEX_ELASTICSEARCH_URL: ${URBEX_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      URBEX_ELASTICSEARCH_INDEX: ${URBEX_ELASTICSEARCH_INDEX:-urbex_places_v1}
      URBEX_ELASTICSEARCH_USER: ${URBEX_ELASTICSEARCH_USER:-elastic}
      URBEX_ELASTICSEARCH_PASSWORD: ${URBEX_ELASTICSEARCH_PASSWORD:-}
      URBEX_TELEGRAM_BOT_TOKEN: ${URBEX_TELEGRAM_BOT_TOKEN:-${TOKEN:-}}
    command:
    - python
    - -m
    - urbex.bootstrap.cli
    - init-storage
    depends_on:
      minio:
        condition: service_healthy
  api:
    build: *id001
    environment:
      URBEX_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      URBEX_ORIGIN: ${URBEX_PROD_ORIGIN:-https://localhost}
      URBEX_SECURE_COOKIE: 'true'
      URBEX_ENVIRONMENT: production
      URBEX_S3_ENDPOINT: http://minio:9000
      URBEX_S3_ACCESS_KEY: ${URBEX_S3_ACCESS_KEY:-local-minio}
      URBEX_S3_SECRET_KEY: ${URBEX_S3_SECRET_KEY:-local-minio-change-me}
      URBEX_S3_BUCKET: urbex-private
      URBEX_ELASTICSEARCH_URL: ${URBEX_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      URBEX_ELASTICSEARCH_INDEX: ${URBEX_ELASTICSEARCH_INDEX:-urbex_places_v1}
      URBEX_ELASTICSEARCH_USER: ${URBEX_ELASTICSEARCH_USER:-elastic}
      URBEX_ELASTICSEARCH_PASSWORD: ${URBEX_ELASTICSEARCH_PASSWORD:-}
      URBEX_TELEGRAM_BOT_TOKEN: ${URBEX_TELEGRAM_BOT_TOKEN:-${TOKEN:-}}
      URBEX_GEOCODER_URL: ${URBEX_GEOCODER_URL:-}
      URBEX_TELEGRAM_BOT_USERNAME: ${URBEX_TELEGRAM_BOT_USERNAME:-}
    ports:
    - 127.0.0.1:58000:8000
    depends_on:
      storage-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
    - 127.0.0.1:80:3100
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3100').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
      target: production
    image: telegram-bot:prod
    restart: unless-stopped
    init: true
    env_file:
    - ./.env
    volumes:
    - bot_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      loki:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      rabbitmq-topology:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      ELASTICSEARCH_HOST: ${URBEX_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTIC_URL: ${URBEX_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USER: ${URBEX_ELASTICSEARCH_USER:-elastic}
      ELASTICSEARCH_PASSWORD: ${URBEX_ELASTICSEARCH_PASSWORD:-}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
  places-worker:
    build:
      context: .
      dockerfile: bot/Dockerfile
      target: production
    image: telegram-bot:prod
    restart: unless-stopped
    init: true
    env_file:
    - ./.env
    volumes:
    - bot_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      loki:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      rabbitmq-topology:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      ELASTICSEARCH_HOST: ${URBEX_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTIC_URL: ${URBEX_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USER: ${URBEX_ELASTICSEARCH_USER:-elastic}
      ELASTICSEARCH_PASSWORD: ${URBEX_ELASTICSEARCH_PASSWORD:-}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
    command:
    - python
    - -m
    - application.workers.places_bootstrap_worker
  migrations:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      URBEX_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      URBEX_ORIGIN: ${URBEX_PROD_ORIGIN:-https://localhost}
      URBEX_SECURE_COOKIE: 'true'
      URBEX_ENVIRONMENT: production
      URBEX_S3_ENDPOINT: http://minio:9000
      URBEX_S3_ACCESS_KEY: ${URBEX_S3_ACCESS_KEY:-local-minio}
      URBEX_S3_SECRET_KEY: ${URBEX_S3_SECRET_KEY:-local-minio-change-me}
      URBEX_S3_BUCKET: urbex-private
      URBEX_ELASTICSEARCH_URL: ${URBEX_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      URBEX_ELASTICSEARCH_INDEX: ${URBEX_ELASTICSEARCH_INDEX:-urbex_places_v1}
      URBEX_ELASTICSEARCH_USER: ${URBEX_ELASTICSEARCH_USER:-elastic}
      URBEX_ELASTICSEARCH_PASSWORD: ${URBEX_ELASTICSEARCH_PASSWORD:-}
      URBEX_TELEGRAM_BOT_TOKEN: ${URBEX_TELEGRAM_BOT_TOKEN:-${TOKEN:-}}
    command:
    - python
    - -m
    - urbex.bootstrap.migrate
    depends_on:
      db:
        condition: service_healthy
  rabbitmq-topology:
    build:
      context: .
      dockerfile: bot/Dockerfile
      target: production
    image: telegram-bot:prod
    restart: 'no'
    command:
    - python
    - -m
    - infrastructure.messaging.rabbitmq.exchange_queue_topology
    env_file:
    - ./.env
    volumes:
    - bot_logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  db:
    image: postgis/postgis:15-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urbex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-urbex}
    volumes:
    - urbex_pg:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
    - 127.0.0.1:15672:15672
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - check_port_connectivity
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  loki:
    image: grafana/loki:2.8.2
    user: 0:0
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    volumes:
    - loki_data:/loki
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  grafana:
    image: grafana/grafana:10.2.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    ports:
    - 127.0.0.1:3000:3000
    depends_on:
    - loki
    volumes:
    - grafana_data:/var/lib/grafana
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  urbex_pg: null
  urbex_photos: null
  urbex_search: null
  bot_logs:
    name: telegram-bot-prod_bot_logs
  loki_data:
    name: telegram-bot-prod_loki_data
  grafana_data:
    name: telegram-bot-prod_grafana_data
  rabbitmq_data:
    name: telegram-bot-prod_rabbitmq_data
