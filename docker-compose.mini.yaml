# Минимальный стек бота. Elasticsearch нужен для поиска и индексации мест.
# migrations и rabbitmq-topology выполняются один раз перед запуском бота и воркера.
name: urbexfinder-mini
services:
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file:
    - ./.env
    volumes:
    - ./bot:/app
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      rabbitmq-topology:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    environment:
      URBEX_S3_ENDPOINT: ${URBEX_S3_ENDPOINT:-http://minio:9000}
      URBEX_S3_ACCESS_KEY: ${URBEX_S3_ACCESS_KEY:-local-minio}
      URBEX_S3_SECRET_KEY: ${URBEX_S3_SECRET_KEY:-local-minio-change-me}
      URBEX_S3_BUCKET: ${URBEX_S3_BUCKET:-urbex-private}
      ELASTICSEARCH_HOST: ${URBEX_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTIC_URL: ${URBEX_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USER: ${URBEX_ELASTICSEARCH_USER:-elastic}
      ELASTICSEARCH_PASSWORD: ${URBEX_ELASTICSEARCH_PASSWORD:-}
      POSTGRES_USER: ${POSTGRES_USER:-urbex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-urbex}
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
    image: ${BOT_IMAGE:-telegram-bot:local}
    command:
    - python
    - main.py
  db:
    image: postgis/postgis:15-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urbex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-urbex}
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - urbex_pg:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
    - 5672:5672
    - 15672:15672
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - check_port_connectivity
      interval: 5s
      timeout: 5s
      retries: 12
  places-worker:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file:
    - ./.env
    volumes:
    - ./bot:/app
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      rabbitmq-topology:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    environment:
      URBEX_S3_ENDPOINT: ${URBEX_S3_ENDPOINT:-http://minio:9000}
      URBEX_S3_ACCESS_KEY: ${URBEX_S3_ACCESS_KEY:-local-minio}
      URBEX_S3_SECRET_KEY: ${URBEX_S3_SECRET_KEY:-local-minio-change-me}
      URBEX_S3_BUCKET: ${URBEX_S3_BUCKET:-urbex-private}
      ELASTICSEARCH_HOST: ${URBEX_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTIC_URL: ${URBEX_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USER: ${URBEX_ELASTICSEARCH_USER:-elastic}
      ELASTICSEARCH_PASSWORD: ${URBEX_ELASTICSEARCH_PASSWORD:-}
      POSTGRES_USER: ${POSTGRES_USER:-urbex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-urbex}
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
    image: ${BOT_IMAGE:-telegram-bot:local}
    command:
    - python
    - -m
    - application.workers.places_bootstrap_worker
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.11
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
    - urbex_search:/usr/share/elasticsearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'
        >/dev/null
      interval: 5s
      timeout: 8s
      retries: 30
    restart: unless-stopped
  migrations:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      URBEX_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-urbex}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-urbex}
    command:
    - python
    - -m
    - urbex.bootstrap.migrate
    depends_on:
      db:
        condition: service_healthy
    image: ${URBEX_API_IMAGE:-urbex-api:local}
    volumes:
    - ./api:/app:ro
  rabbitmq-topology:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: 'no'
    command:
    - python
    - -m
    - infrastructure.messaging.rabbitmq.exchange_queue_topology
    env_file:
    - ./.env
    volumes:
    - ./bot:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
    image: ${BOT_IMAGE:-telegram-bot:local}
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
volumes:
  urbex_pg: null
  urbex_search: null
  rabbitmq_data: null
