# Local SearXNG for UrbexFinder OSINT reports. JSON API is required by the API service.
use_default_settings: true
engines:
  - name: google
    disabled: false
  - name: google images
    disabled: false
  - name: yandex
    disabled: false
  - name: yandex images
    disabled: false
general:
  instance_name: UrbexFinder XNG
server:
  # Internal Docker service; not exposed publicly in default compose.
  secret_key: "urbex-local-searxng-change-me"
  limiter: false
  image_proxy: false
  method: "GET"
search:
  safe_search: 0
  autocomplete: ""
  default_lang: "ru"
  formats:
    - html
    - json
ui:
  static_use_hash: true
outgoing:
  request_timeout: 8.0
