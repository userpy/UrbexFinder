[project]
name = "urbex-api"
version = "0.1.0"
description = "UrbexFinder FastAPI application"
requires-python = ">=3.13,<3.15"
dependencies = [
    "urbex-shared",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "SQLAlchemy>=2.0.46,<2.1",
    "psycopg2-binary>=2.9.11,<3",
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "pydantic-settings>=2.10,<3",
    "email-validator>=2.2,<3",
    "boto3>=1.35,<2",
    "Pillow>=11.1,<13",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
urbex-shared = { path = "../shared", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9"
