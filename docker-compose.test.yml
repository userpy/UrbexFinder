name: telegram-bot-tests

services:
  test-db:
    image: postgres:15
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: telegram_bot_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d telegram_bot_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: ./bot
      target: test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: telegram_bot_test
      POSTGRES_HOST: test-db
      POSTGRES_PORT: 5432
    depends_on:
      test-db:
        condition: service_healthy
    volumes:
      - ./bot:/app
    command: ["sh", "tests/run.sh"]
